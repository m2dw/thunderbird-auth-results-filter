name: CI

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    name: Test and package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build XPI package
        run: npm run package

      - name: Upload XPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: auth-results-filter-xpi
          path: dist/*.xpi
          if-no-files-found: error
